[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agents-discord"
version = "2.0.0"
description = "Research-only U.S. equities scanner with TradingAgents, scored entries, Postgres persistence, and Discord alerts"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "tenacity>=9,<10",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "yfinance>=1.4.1,<2",
]

[project.optional-dependencies]
research = ["tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@main"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
ta-discord = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
